name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon -PbuildNumber=${{ github.run_number }}
          cp app/build/outputs/apk/release/app-release.apk CacahStok.apk

      - name: Terbitkan di Releases (link download)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Cacah Stok v1.0.${{ github.run_number }}
          body: |
            Download dan install CacahStok.apk di HP Android (minimal Android 7.0).
            Link tetap untuk versi terbaru:
            https://github.com/${{ github.repository }}/releases/latest/download/CacahStok.apk
          files: CacahStok.apk
          make_latest: true
